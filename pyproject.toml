[project]
name = "skill-eval"
version = "0.1.0"
description = "Eval/comparison harness for two Claude Code Skills"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk",
    "anthropic",
    "langgraph",
    "arize-phoenix",
    "arize-phoenix-otel",
    "openinference-instrumentation-langchain",
    "openinference-instrumentation-anthropic",
    "streamlit",
    "chromadb",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["skill_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real Anthropic API (skipped by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["skill_eval"]
