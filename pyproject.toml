[project]
name = "skill-eval"
version = "0.1.0"
description = "Eval/comparison harness for two Claude Code Skills"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk",
    "anthropic",
    "langgraph",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
    "pydantic>=2.13.4",
    "chromadb",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "ruff",
    "pytest-playwright>=0.8.0",
    "playwright>=1.60.0",
    "httpx>=0.28.1",
    "schemathesis>=4.21.4",
]

[tool.hatch.build.targets.wheel]
packages = ["skill_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real Anthropic API (skipped by default)",
    "e2e: drives a real browser (Playwright) against a live Streamlit server — run with `just e2e`",
]
addopts = "-m 'not live and not e2e'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["skill_eval"]
